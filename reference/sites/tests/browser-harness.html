<!doctype html><html lang="es"><meta charset="utf-8"><title>ASTROPY · Pruebas de integración</title><style>body{font:14px/1.6 system-ui;background:#151020;color:#eee;padding:30px}button{padding:12px 20px}pre{white-space:pre-wrap}</style><h1>Pruebas de integración con datos ficticios</h1><button id="run">Ejecutar pruebas</button><pre id="out">Listo.</pre><script type="module">
const out=document.querySelector('#out'),run=document.querySelector('#run');let checks=[];const uid=()=>Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');const base='qa-'+uid().slice(0,6);
async function api(path,data,user='a',key){const headers={};if(user!==null){headers['oai-authenticated-user-id']=base+user;headers['oai-authenticated-user-email']=base+user+'@example.invalid';}if(data!==undefined)headers['Content-Type']='application/json';if(key)headers['Idempotency-Key']=key;const r=await fetch('/api/'+path,{headers,method:data===undefined?'GET':'POST',body:data===undefined?undefined:JSON.stringify(data)});const ct=r.headers.get('content-type'),d=ct?.includes('application/pdf')||ct?.includes('text/csv')?await r.text():await r.json();return {s:r.status,d};}
function check(n,b){if(!b)throw Error(n);checks.push(n);out.textContent=checks.map(n=>'OK '+n).join('\n');}
const payload={product:'lectura',name:'Luna Demo',birth:'1998-10-10',theme:'general',adult:true,terms:true,marketing:false,amount:1,currency:'USD'};
async function create(product='lectura',user='a',extra={}){const b={...payload,product,...(product==='compatibilidad'?{name2:'Sol Demo',birth2:'1996-07-30',otherConsent:true}:{}),...extra},key=uid(),r=await api('orders',b,user,key);check('Crear '+product,r.s===201);return {b,key,o:r.d};}
run.onclick=async()=>{run.disabled=true;checks=[];try{
 const daily=await api('daily');check('12 signos disponibles',daily.s===200&&daily.d.items.length===12);check('Caché diario estable',JSON.stringify((await api('daily')).d)===JSON.stringify(daily.d));
 const {b,key,o}=await create(),id=o.id;check('Precio del servidor 19000',o.amount===19000);check('Solicitud idempotente',(await api('orders',b,'a',key)).d.id===id);check('Clave repetida con otros datos rechazada',(await api('orders',{...b,name:'Otra Demo'},'a',key)).s===409);
 check('PDF antes de pagar bloqueado',(await api('orders/'+id+'/pdf')).s===409);check('Pedido ajeno bloqueado',(await api('orders/'+id,undefined,'b')).s===404);check('PDF ajeno bloqueado',(await api('orders/'+id+'/pdf',undefined,'b')).s===404);
 check('Menor rechazado',(await api('orders',{...b,birth:'2015-01-01'},'minor',uid())).s===400);check('Fecha imposible rechazada',(await api('orders',{...b,birth:'1998-02-31'},'bad-date',uid())).s===400);check('Consentimiento obligatorio',(await api('orders',{...b,terms:false},'no-consent',uid())).s===400);check('Nombre HTML rechazado',(await api('orders',{...b,name:'<b>demo</b>'},'html',uid())).s===400);
 check('Rechazo no entrega',(await api('demo/payments/'+id,{outcome:'declined'})).d.deliveryStatus==='pending');check('PDF tras rechazo bloqueado',(await api('orders/'+id+'/pdf')).s===409);
 await Promise.all([api('demo/payments/'+id,{outcome:'approved'}),api('demo/payments/'+id,{outcome:'approved'})]);const paid=(await api('orders/'+id)).d;check('Confirmaciones concurrentes generan una sola vez',paid.deliveryStatus==='delivered'&&paid.attempts===1);check('Resultado inmutable ante repetición',JSON.stringify((await api('demo/payments/'+id,{outcome:'approved'})).d.result)===JSON.stringify(paid.result));const pdf=await api('orders/'+id+'/pdf');check('PDF privado válido',pdf.s===200&&pdf.d.startsWith('%PDF-1.4'));
 const c=(await create('compatibilidad','c')).o;check('Compatibilidad con cinco módulos',(await api('demo/payments/'+c.id,{outcome:'approved'},'c')).d.result.sections.length===5);const p=(await create('premium','d')).o;check('Premium con seis módulos',(await api('demo/payments/'+p.id,{outcome:'approved'},'d')).d.result.sections.length===6);
 const e=(await create('lectura','e')).o;const failed=(await api('demo/payments/'+e.id,{outcome:'approved',failGeneration:true},'e')).d;check('Fallo preserva pago aprobado',failed.paymentStatus==='paid'&&failed.deliveryStatus==='error');check('Reintento recupera entrega',(await api('orders/'+e.id+'/retry',{},'e')).d.deliveryStatus==='delivered');
 const cancelled=(await create('lectura','f')).o;check('Cancelación no paga',(await api('demo/payments/'+cancelled.id,{outcome:'cancelled'},'f')).d.paymentStatus==='cancelled');check('Cancelación terminal',(await api('demo/payments/'+cancelled.id,{outcome:'approved'},'f')).s===409);check('Webhook real cerrado',(await api('payments/webhook',{})).s===503);
 check('Reembolso simulado',(await api('admin/refund/'+id,{},null)).s===200);check('PDF reembolsado bloqueado',(await api('orders/'+id+'/pdf')).s===409);
 const ex={category:'publicidad',date:daily.d.date,amount:12000,note:'=UNTRUSTED_CSV_TEST'},exkey=uid();check('Registrar gasto',(await api('admin/expenses',ex,null,exkey)).s===200);check('Repetir gasto sin duplicar',(await api('admin/expenses',ex,null,exkey)).s===200);check('CSV previene fórmulas',(await api('admin/export',undefined,null)).d.includes("'=UNTRUSTED_CSV_TEST"));check('Gasto negativo rechazado',(await api('admin/expenses',{...ex,amount:-1},null,uid())).s===400);
 check('Fecha de gasto inválida rechazada',(await api('admin/expenses',{...ex,date:'2026-99-99'},null,uid())).s===400);const dash=(await api('admin/dashboard',undefined,null)).d;check('Separación facturación reembolsos costos',dash.refunds>=19000&&dash.adSpend>=12000&&dash.monthRevenue===dash.monthGross-dash.refunds);check('Historial separado',!(await api('orders')).d.orders.some(o=>o.id===c.id));
 const code=(await api('me',undefined,'referrer')).d.referralCode;check('Autorreferido rechazado',(await api('orders',{...payload,referral:code},'referrer',uid())).s===400);const ref=await create('lectura','new-ref',{referral:code});check('Descuento calculado por servidor',ref.o.amount===17100&&ref.o.discount===1900);check('Segunda reserva de descuento rechazada',(await api('orders',ref.b,'new-ref',uid())).s===400);
 out.textContent+='\n\nPASS: '+checks.length+' verificaciones. Identidades '+base+'.';
}catch(e){out.textContent+='\n\nFAIL: '+e.message;}finally{run.disabled=false;}};
</script></html>
