<!doctype html><html lang="es"><meta charset="utf-8"><title>LÚMINA · QA de movimiento</title><style>body{margin:0;background:#7a8a87;font:13px/1.6 system-ui}header{position:sticky;top:0;z-index:3;padding:12px 22px;background:#f2f0df;color:#1b3430;display:flex;gap:15px;align-items:center;flex-wrap:wrap}button{padding:7px 12px}#result{white-space:pre-line;font-size:11px}iframe{display:block;width:100%;height:850px;border:0;margin:auto;background:#101b24}</style><header><button id="prepare">Crear lectura ficticia y medir apertura</button><button id="qrwait">Preparar espera QR ficticia</button><button id="approve">Confirmar ingreso ficticio</button><button id="reopen">Reabrir misma lectura</button><button id="mobile">Vista móvil 390px</button><button id="wide">Vista escritorio</button><span id="result">Sin pagos, sin llamadas IA.</span></header><iframe id="view" title="Lectura bajo prueba"></iframe><script type="module">
const frame=document.querySelector('iframe'),out=document.querySelector('#result'),uid=()=>Array.from(crypto.getRandomValues(new Uint8Array(16)),v=>v.toString(16).padStart(2,'0')).join('');let orderId='',observer,seen=0,logged=false;
async function api(path,data,key){const r=await fetch('/api/'+path,{method:data?'POST':'GET',headers:data?{'Content-Type':'application/json',...(key?{'Idempotency-Key':key}:{})}:{},body:data?JSON.stringify(data):undefined});const d=await r.json();if(!r.ok)throw Error(d.error);return d;}
function watch(){try{observer?.disconnect();seen=0;logged=false;const doc=frame.contentDocument;const inspect=()=>{if(doc.querySelector('.reading-reveal-stage')&&!seen){seen=performance.now();out.textContent='Apertura visible. Midiendo…';}if(doc.querySelector('.result-hero')&&!logged){logged=true;const elapsed=seen?Math.round(performance.now()-seen):0;out.textContent=seen?(elapsed>=2800&&elapsed<4500?'PASS':'REVISAR')+': apertura '+elapsed+' ms. '+doc.querySelectorAll('.reading-module').length+' módulos.':'PASS: misma lectura sin nueva espera.';}};observer=new MutationObserver(inspect);observer.observe(doc.documentElement,{childList:true,subtree:true,attributes:true});inspect();}catch(e){out.textContent=e.message;}}
frame.onload=watch;
document.querySelector('#prepare').onclick=async()=>{out.textContent='Preparando pedido ficticio…';try{const health=await api('health');if(health.payments!=='demo')throw Error('Solo se permite esta prueba en demo.');const order=await api('orders',{product:'premium',name:'Persona Demo',birth:'1998-11-03',theme:'general',adult:true,terms:true},uid());orderId=order.id;await api('demo/payments/'+orderId,{outcome:'approved'});out.textContent='Abriendo lectura…';frame.src='/resultado/'+orderId;}catch(e){out.textContent='FAIL: '+e.message;}};
document.querySelector('#qrwait').onclick=async()=>{out.textContent='Preparando QR ficticio…';try{const canvas=document.createElement('canvas');canvas.width=200;canvas.height=200;const c=canvas.getContext('2d');c.fillStyle='white';c.fillRect(0,0,200,200);c.fillStyle='black';c.font='bold 18px sans-serif';c.fillText('TEST ONLY',40,92);c.font='12px sans-serif';c.fillText('NO REALIZAR PAGOS',30,120);await api('admin/qr',{slot:3,holder:'Titular Ficticio',label:'Mango · QA',amount:49000,generatedAt:new Date(Date.now()-60000).toISOString(),expiresAt:new Date(Date.now()+3600000).toISOString(),authorized:true,reusable:true,amountConfirmed:true,image:canvas.toDataURL('image/png')});const order=await api('orders',{product:'premium',name:'Persona Demo',birth:'1998-11-03',theme:'general',adult:true,terms:true},uid());orderId=order.id;await api('orders/'+orderId+'/qr',{});await api('orders/'+orderId+'/payment-report',{payer:'Persona Demo',reference:'VISUAL-'+orderId.slice(0,8)});out.textContent='Pago pendiente de verificación. No debe mostrarse el informe.';frame.src='/resultado/'+orderId;}catch(e){out.textContent='FAIL: '+e.message;}};
document.querySelector('#approve').onclick=async()=>{try{if(!orderId)return;await api('admin/manual-payment/'+orderId,{action:'approve',amount:49000,checked:true,reference:'VISUAL-'+orderId.slice(0,8)});out.textContent='Confirmación ficticia registrada. Consultá el estado en el iframe.';}catch(e){out.textContent='FAIL: '+e.message;}};
document.querySelector('#reopen').onclick=()=>{if(orderId){out.textContent='Reabriendo…';frame.src='/resultado/'+orderId;}};
document.querySelector('#mobile').onclick=()=>frame.style.width='390px';document.querySelector('#wide').onclick=()=>frame.style.width='100%';
</script></html>
